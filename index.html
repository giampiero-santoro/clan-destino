<style>
  /* Personalizzazione di Bulma: colori e caratteri allegri */
  :root {
    --inchiostro: #1d1b3a;
    --sole: #ffc93c;
    --corallo: #ff6b6b;
    --turchese: #2ec4b6;
    --viola: #8a6bff;
    --blu: #3b82f6;
    --pagina: #fbfaff;
    --bulma-family-primary: "Nunito", "Helvetica Neue", Arial, sans-serif;
    --bulma-body-background-color: var(--pagina);
    --bulma-text: var(--inchiostro);
    --bulma-text-strong: var(--inchiostro);
    --bulma-card-radius: 1.5rem;
    --bulma-card-shadow: none;
  }
  body { color: var(--inchiostro); }
  .title, .subtitle { font-family: "Fredoka", "Nunito", "Helvetica Neue", Arial, sans-serif; color: var(--inchiostro); }
  .title { font-weight: 700; }
  :focus-visible { outline: 4px solid var(--viola); outline-offset: 3px; }

  /* Presentazione */
  .hero-brio { background: var(--sole); position: relative; overflow: hidden; }
  .hero-brio .hero-body { position: relative; z-index: 1; }
  .titolo-grande { font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -0.01em; }

  .disco {
    width: 100%; max-width: 320px; aspect-ratio: 1;
    margin-inline: auto;
    background: #fff;
    border: 4px solid var(--inchiostro);
    border-radius: 50%;
    box-shadow: 8px 8px 0 var(--inchiostro);
    display: grid; place-items: center;
    padding: 6%;
    transform: rotate(-4deg);
    animation: rimbalzo .9s cubic-bezier(.3,1.5,.5,1) both;
  }
  .disco img { width: 100%; height: auto; display: block; }
  @keyframes rimbalzo {
    0%   { opacity: 0; transform: translateY(-40px) scale(.8) rotate(-14deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(-4deg); }
  }

  .conteggio { background: #fff; border: 3px solid var(--inchiostro); font-weight: 800; color: var(--inchiostro); }

  /* Coriandoli decorativi */
  .coriandolo { position: absolute; z-index: 0; pointer-events: none; }
  .c1 { width: 90px; height: 90px; border-radius: 50%; background: var(--corallo); top: 8%; right: 6%; }
  .c2 { width: 56px; height: 56px; background: var(--viola); border-radius: 14px; transform: rotate(18deg); bottom: 16%; right: 22%; }
  .c3 { width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 60px solid var(--turchese); top: 14%; left: 44%; transform: rotate(-12deg); }
  .c4 { width: 36px; height: 36px; border: 8px solid var(--inchiostro); border-radius: 50%; bottom: 12%; left: 4%; }
  .onda { display: block; width: 100%; height: 56px; margin-top: -1px; }

  /* Sezione elenco */
  .sezione-titolo { font-size: clamp(1.9rem, 4vw, 2.6rem); display: inline-block; position: relative; margin-bottom: 1.75rem; }
  .sezione-titolo::after {
    content: ""; display: block; height: 10px; margin-top: -10px; position: relative; z-index: -1;
    background: var(--sole); border-radius: 999px; transform: rotate(-1deg);
  }

  /* Schede colorate */
  .c-giallo   { --c: var(--sole); }
  .c-corallo  { --c: var(--corallo); }
  .c-turchese { --c: var(--turchese); }
  .c-viola    { --c: var(--viola); }
  .c-blu      { --c: var(--blu); }

  .card.sito {
    height: 100%; display: flex; flex-direction: column;
    background: #fff;
    border: 3px solid var(--inchiostro);
    border-radius: 1.5rem;
    box-shadow: 6px 6px 0 var(--inchiostro);
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card.sito:hover { transform: translate(-3px, -3px) rotate(-.6deg); box-shadow: 9px 9px 0 var(--inchiostro); }
  .card.sito .card-content { flex: 1; padding: 1.5rem 1.5rem 1.25rem; }

  .bollo {
    width: 4.5rem; height: 4.5rem; margin-bottom: 1rem;
    background: var(--c); border: 3px solid var(--inchiostro); border-radius: 50%;
    display: grid; place-items: center; font-size: 2.1rem; line-height: 1;
    box-shadow: 3px 3px 0 var(--inchiostro);
  }
  .card.sito .title { font-size: 1.5rem; margin-bottom: .5rem; }
  .card.sito p { color: #3d3b5c; }

  .card.sito .card-footer { border-top: 3px solid var(--inchiostro); background: var(--c); }
  .card.sito .card-footer-item {
    font-family: "Fredoka", "Nunito", Arial, sans-serif; font-weight: 600; font-size: 1.1rem;
    color: var(--inchiostro); padding: .9rem; text-decoration: none;
  }
  .card.sito .card-footer-item:hover { background: var(--inchiostro); color: #fff; }

  /* Piè di pagina */
  .footer-brio { background: var(--inchiostro); color: #fff; padding: 2rem 1.5rem; }
  .footer-brio p { color: #e9e7ff; }

  @media (max-width: 768px) { .c2, .c3 { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .disco { animation: none; }
    .card.sito { transition: none; }
    .card.sito:hover { transform: none; }
  }
</style>
</head>

    <span class="coriandolo c1" aria-hidden="true"></span>
    <span class="coriandolo c2" aria-hidden="true"></span>
    <span class="coriandolo c3" aria-hidden="true"></span>
    <span class="coriandolo c4" aria-hidden="true"></span>
    <div class="hero-body">
      <div class="container">
        <div class="columns is-vcentered is-variable is-8">

  <script>
/*
  ELENCO DEI SITI DI CLAN DESTINO
  --------------------------------
  Per cambiare i siti mostrati modifica solo questo elenco, dentro index.html.

  AGGIUNGERE un sito: copia un blocco { ... }, incolla in fondo all'elenco
  (prima della parentesi quadra chiusa), ricordati la virgola dopo il blocco
  precedente e cambia i campi.

  TOGLIERE un sito: cancella il suo blocco { ... } con la virgola.

  CAMBIARE L'ORDINE: sposta i blocchi su o giù. Il primo appare per primo.

  Campi:
    titolo       il nome mostrato sulla scheda
    descrizione  una o due frasi
    url          l'indirizzo completo del sito (con https://)
    icona        un emoji che appare nel cerchio della scheda
    colore       facoltativo: giallo, corallo, turchese, viola oppure blu.
                 Se lo togli, il colore viene scelto in automatico.
*/

const SITI = [
  {
    titolo: "Confronto costi veicoli",
    descrizione:
      "Confronta costi di percorrenza e consumi tra auto a benzina, diesel, GPL, metano, elettriche e ibride.",
    url: "https://giampiero-santoro.github.io/confronto-costi-veicoli/",
    icona: "🚗",
    colore: "corallo",
  },
  {
    titolo: "Il Mio Ricettario",
    descrizione:
      "Un ricettario di cucina personale: salva le ricette, importale e ritrovale quando servono.",
    url: "https://giampiero-santoro.github.io/Il-Mio-Ricettario/",
    icona: "🍲",
    colore: "giallo",
  },
  {
    titolo: "Copione teatrale",
    descrizione:
      "Un editor per scrivere e organizzare i copioni di teatro, pensato per il lavoro di compagnia.",
    url: "https://giampiero-santoro.github.io/copione-teatrale/",
    icona: "🎭",
    colore: "viola",
  },
  {
    titolo: "Erbolario Digitale",
    descrizione:
      "Cerca tra 100 tisane per nome o per effetto, con la guida alle temperature per infusi, decotti e macerati.",
    url: "https://giampiero-santoro.github.io/tisane/",
    icona: "🌿",
    colore: "turchese",
  },
  {
    titolo: "FOSS Finder",
    descrizione:
      "Scopri applicazioni open source senza pubblicità e tracciamento, dal catalogo F-Droid. Progetto didattico.",
    url: "https://giampiero-santoro.github.io/foss-app-finder/",
    icona: "🔓",
    colore: "blu",
  },
];

  </script>
  <script>
    (function () {
      var lista = document.getElementById("siti");
      var conteggio = document.getElementById("conteggio");
      document.getElementById("anno").textContent = new Date().getFullYear();

      var elenco = (typeof SITI !== "undefined" && Array.isArray(SITI)) ? SITI : [];
      var colori = ["giallo", "corallo", "turchese", "viola", "blu"];

      if (!elenco.length) {
        var col = document.createElement("div");
        col.className = "column is-12";
        var msg = document.createElement("div");
        msg.className = "notification is-warning is-light has-text-centered";
        msg.textContent = "Nessun sito per ora. Aggiungine uno nell’elenco SITI dentro index.html.";
        col.appendChild(msg);
        lista.appendChild(col);
        conteggio.hidden = true;
        return;
      }

      conteggio.textContent = elenco.length === 1 ? "1 sito pubblicato" : elenco.length + " siti pubblicati";

      function el(tag, cls, testo) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (testo !== undefined) e.textContent = testo;
        return e;
      }

      elenco.forEach(function (s, i) {
        var colore = colori.indexOf(s.colore) >= 0 ? s.colore : colori[i % colori.length];

        var col = el("div", "column is-12-mobile is-6-tablet is-4-desktop");
        var card = el("article", "card sito c-" + colore);

        var content = el("div", "card-content");
        var bollo = el("div", "bollo", s.icona || "★");
        bollo.setAttribute("aria-hidden", "true");
        content.appendChild(bollo);
        content.appendChild(el("h3", "title", s.titolo));
        content.appendChild(el("p", "", s.descrizione || ""));

        var footer = el("footer", "card-footer");
        var a = el("a", "card-footer-item", "Apri il sito");
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.setAttribute("aria-label", "Apri il sito " + s.titolo);
        footer.appendChild(a);

        card.appendChild(content);
        card.appendChild(footer);
        col.appendChild(card);
        lista.appendChild(col);
      });
    })();
  </script>
